<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>NUPIEEPRO — Redefinir Senha</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:   #000000;
      --purple:  #1e3a6e;
      --orange:  #d0541a;
      --white:   #ffffff;
      --surface: #29324f;
    }

    html { background: #000000; -webkit-font-smoothing: antialiased; }

    body {
      min-height: 100svh;
      background: #000000;
      color: #ffffff;
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .bg-layer::before {
      content: '';
      position: absolute;
      bottom: -25%; left: -20%;
      width: 65vw; height: 75vh;
      background: radial-gradient(ellipse, rgba(47,29,112,0.45) 0%, transparent 65%);
      filter: blur(90px);
    }
    .bg-layer::after {
      content: '';
      position: absolute;
      top: -15%; right: -15%;
      width: 50vw; height: 60vh;
      background: radial-gradient(ellipse, rgba(208,84,26,0.07) 0%, transparent 60%);
      filter: blur(70px);
    }

    .wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      padding: 1.5rem;
      display: flex; flex-direction: column; align-items: center;
    }

    /* Logo row */
    .logo-row {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeDown 0.5s cubic-bezier(0.16,1,0.3,1) 0ms both;
    }
    .logo-row img {
      height: 80px; width: auto; object-fit: contain;
      margin-bottom: 0.75rem;
      filter: drop-shadow(0 4px 20px rgba(208,84,26,0.22));
    }
    .logo-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 24px; font-weight: 900; letter-spacing: -0.04em;
    }
    .logo-name .lo { color: #d0541a; }

    /* Card */
    .card {
      width: 100%;
      position: relative;
      background: rgba(41,50,79,0.68);
      backdrop-filter: blur(36px) saturate(1.15);
      -webkit-backdrop-filter: blur(36px) saturate(1.15);
      border-radius: 24px;
      padding: 2.2rem 2rem;
      box-shadow:
        0 32px 72px -16px rgba(0,0,0,0.85),
        0 0 0 1px rgba(47,29,112,0.35) inset;
      opacity: 0;
      animation: fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) 130ms both;
    }
    .card::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(208,84,26,0.55) 0%, rgba(47,29,112,0.55) 100%);
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Eyebrow */
    .eyebrow {
      display: flex; align-items: center; gap: 8px;
      font-size: 9.5px; font-weight: 800;
      letter-spacing: 0.24em; text-transform: uppercase;
      color: #d0541a; margin-bottom: 10px;
    }
    .eyebrow-line { width: 18px; height: 2px; background: #d0541a; border-radius: 1px; flex-shrink: 0; }

    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 22px; font-weight: 800; margin-bottom: 6px;
    }
    .sub {
      font-size: 13px; color: rgba(255,255,255,0.38);
      line-height: 1.6; margin-bottom: 1.6rem;
    }

    /* Fields */
    .field { margin-bottom: 1.1rem; }
    .field label {
      display: block; font-size: 10px; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.35); margin-bottom: 7px;
    }
    .field-wrap { position: relative; }
    .field-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); font-size: 14px;
      opacity: 0.28; pointer-events: none; transition: opacity 0.2s;
    }
    .field input {
      width: 100%;
      background: #000000;
      border: 1px solid rgba(41,50,79,0.95);
      border-radius: 12px;
      padding: 13px 14px 13px 43px;
      color: #ffffff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      caret-color: #d0541a;
    }
    .field input::placeholder { color: rgba(255,255,255,0.18); }
    .field input:focus {
      border-color: #d0541a;
      background: rgba(208,84,26,0.04);
      box-shadow: 0 0 0 3px rgba(208,84,26,0.12);
    }
    .field-wrap:focus-within .field-icon { opacity: 0.70; }

    /* Alert */
    .alert {
      display: none; padding: 11px 14px; border-radius: 11px;
      font-size: 13px; font-weight: 500; margin-bottom: 1rem; line-height: 1.45;
    }
    .alert.error   { display:block; background:rgba(240,80,80,0.10); border:1px solid rgba(240,80,80,0.22); color:#f09090; }
    .alert.success { display:block; background:rgba(45,212,160,0.09); border:1px solid rgba(45,212,160,0.20); color:#2dd4a0; }
    .alert.info    { display:block; background:rgba(208,84,26,0.09); border:1px solid rgba(208,84,26,0.20); color:#e07d43; }

    /* Button */
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px; cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px; font-weight: 700;
      letter-spacing: 0.07em; text-transform: uppercase;
      background: linear-gradient(135deg, #d0541a 0%, #1e3a6e 100%);
      color: #fff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 28px -6px rgba(208,84,26,0.40);
      position: relative; overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.10) 0%, transparent 55%);
      border-radius: inherit; pointer-events: none;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px -8px rgba(208,84,26,0.52); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; pointer-events: none; }

    .back-link {
      display: block; text-align: center; margin-top: 1.2rem;
      font-size: 12px; color: rgba(255,255,255,0.35);
    }
    .back-link a {
      color: rgba(255,255,255,0.65); font-weight: 600;
      text-decoration: none; transition: color 0.2s;
    }
    .back-link a:hover { color: #d0541a; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .card { padding: 1.8rem 1.4rem; border-radius: 20px; }
      .card::before { border-radius: 20px; }
    }
  </style>
</head>
<body>

  <div class="bg-layer" aria-hidden="true"></div>

  <div class="wrap">

    <div class="logo-row">
      <img src="assets/icon.png" alt="NUPIEEPRO">
      <div class="logo-name">NUPIE<span class="lo">EPRO</span></div>
    </div>

    <div class="card" id="card">
      <div class="eyebrow"><span class="eyebrow-line"></span>Segurança</div>
      <h1>Nova Senha</h1>
      <p class="sub">Digite e confirme sua nova senha de acesso ao sistema.</p>

      <div id="resetAlert" class="alert"></div>

      <form id="resetForm" onsubmit="return false;" novalidate>
        <div class="field">
          <label>Nova Senha</label>
          <div class="field-wrap">
            <span class="field-icon">🔒</span>
            <input type="password" id="newPassword"
                   placeholder="Mínimo 8 caracteres, com letras e números"
                   minlength="8" required autocomplete="new-password">
          </div>
        </div>
        <div class="field">
          <label>Confirmar Senha</label>
          <div class="field-wrap">
            <span class="field-icon">🔒</span>
            <input type="password" id="confirmPassword"
                   placeholder="Repita a senha"
                   minlength="8" required autocomplete="new-password">
          </div>
        </div>
        <button id="btnSave" class="btn" type="button" onclick="salvarNovaSenha()">
          Salvar nova senha
        </button>
      </form>

      <p class="back-link">Lembrou a senha? <a href="index.html">← Voltar ao login</a></p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/app.js?v=98"></script>
  <script src="js/validacao.js?v=98"></script>
  <script src="js/auth.js?v=98"></script>
  <script>
    function showAlert(msg, type) {
      const el = document.getElementById('resetAlert');
      el.textContent = msg;
      el.className = 'alert ' + type;
    }

    /* Mostra o link como inválido/expirado e tira o formulário do caminho —
       ver comentário mais abaixo sobre os dois jeitos disso acontecer. */
    function mostrarLinkInvalido(msg) {
      showAlert(msg || 'Link inválido ou expirado. Solicite um novo abaixo.', 'error');
      const form = document.getElementById('resetForm');
      if (form) form.style.display = 'none';
      const backLink = document.querySelector('.back-link');
      if (backLink) backLink.innerHTML = '<a href="index.html">← Voltar ao login e solicitar novo link</a>';
    }

    let _linkConfirmado = false;

    if (_sb) {
      /* Link já expirado/usado: o Supabase não dispara PASSWORD_RECOVERY —
         ele volta pro redirectTo com "#error=...&error_description=..." na
         URL. Sem checar isso, a pessoa via um formulário aparentemente
         normal que só falhava (com erro técnico) depois de digitar a nova
         senha inteira. */
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const erroUrl = hashParams.get('error_description') || hashParams.get('error');
      if (erroUrl) {
        const erroDecodificado = decodeURIComponent(erroUrl.replace(/\+/g, ' '));
        mostrarLinkInvalido(traduzErroAuth({ message: erroDecodificado }));
      } else {
        /* A confirmação do link (evento PASSWORD_RECOVERY) depende de rede —
           parse do hash + validação com o servidor Supabase. Em conexão móvel
           ruim isso pode demorar bem mais que poucos segundos; por isso avisa
           que está verificando em vez de deixar o formulário mudo. */
        showAlert('Verificando seu link de redefinição…', 'info');

        _sb.auth.onAuthStateChange(async (event, session) => {
          if (event === 'PASSWORD_RECOVERY') {
            _linkConfirmado = true;
            showAlert('Link válido. Digite sua nova senha abaixo.', 'success');
          } else if (event === 'SIGNED_IN' && session) {
            setTimeout(() => App.redirect('dashboard.html'), 1500);
          }
        });

        /* Nem todo link ruim vem com #error explícito (ex: já foi aberto
           antes numa aba e o hash já sumiu da URL) — se depois de um tempo
           razoável nada confirmou o link, assume que não é válido em vez de
           deixar o formulário parado, sem feedback algum, pra sempre.
           8s (e não os 3s originais) porque isso depende de rede: parsing do
           hash + round-trip com o Supabase — em 3G/4G ruim (comum num evento
           lotado na mesma wifi) 3s estourava fácil e um link VÁLIDO aparecia
           como "expirado" antes mesmo da pessoa digitar a senha nova. */
        setTimeout(() => {
          if (!_linkConfirmado) mostrarLinkInvalido();
        }, 8000);
      }
    } else {
      showAlert('Sistema offline. Verifique sua conexão e recarregue a página.', 'error');
    }

    async function salvarNovaSenha() {
      if (!_sb) { showAlert('Sistema offline. Recarregue a página.', 'error'); return; }
      const pw = document.getElementById('newPassword').value;
      const cf = document.getElementById('confirmPassword').value;
      const erroSenha = senhaForte(pw);
      if (erroSenha) { showAlert(erroSenha, 'error'); return; }
      if (pw !== cf)      { showAlert('As senhas não coincidem.', 'error'); return; }

      const btn = document.getElementById('btnSave');
      btn.disabled = true; btn.textContent = 'Salvando...';

      try {
        const { error } = await _sb.auth.updateUser({ password: pw });
        if (error) throw error;
        showAlert('Senha alterada com sucesso! Redirecionando...', 'success');
        setTimeout(() => App.redirect('index.html'), 2000);
      } catch (err) {
        showAlert(traduzErroAuth(err), 'error');
        btn.disabled = false; btn.textContent = 'Salvar nova senha';
      }
    }

    // Enter em qualquer um dos campos também salva — mesmo padrão do
    // restante do fluxo de acesso (login, recuperação, convite).
    document.getElementById('resetForm')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); salvarNovaSenha(); }
    });
  </script>
</body>
</html>
